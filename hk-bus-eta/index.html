<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>香港巴士到站時間查詢</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>🚌 香港巴士到站查詢</h1>
      <p class="subtitle">九巴 / 龍運 / 城巴 · 到站時間 · 車程估算</p>
    </header>

    <!-- 永遠顯示：路線輸入 -->
    <section class="card route-card">
      <div class="input-row">
        <input type="text" id="routeInput" placeholder="輸入路線號碼，例如 170" autocomplete="off" />
        <button id="searchBtn">查詢</button>
      </div>
    </section>

    <!-- 方向按鈕（查詢後永遠顯示，方便切換） -->
    <div id="directionBar" class="direction-bar hidden"></div>

    <!-- 目前方向資訊 -->
    <p id="currentDirInfo" class="route-info hidden"></p>

    <!-- 車站列表（主畫面） -->
    <section id="mainView" class="hidden">
      <div id="stopList" class="stop-list"></div>
    </section>

    <!-- 計算車程畫面 -->
    <section id="journeyView" class="card hidden">
      <h2>📍 計算車程</h2>

      <div class="journey-row">
        <label>上車站（起點）</label>
        <select id="fromStopSelect">
          <option value="">— 選擇上車站 —</option>
        </select>
      </div>
      <div class="journey-row">
        <label>落車站（終點）</label>
        <select id="toStopSelect">
          <option value="">— 選擇落車站 —</option>
        </select>
      </div>

      <button id="calcJourneyBtn" class="calc-btn">計算車程</button>
      <div id="journeyResult" class="journey-result hidden"></div>

      <button class="back-btn" id="backToStopsBtn">← 返回車站列表</button>
    </section>

    <!-- 右下角浮動按鈕 -->
    <button id="fabJourney" class="fab hidden" title="計算車程">🗺️</button>

    <footer>
      <p>資料來源：DATA.GOV.HK · 九巴 / 龍運 / 城巴</p>
      <p class="note">到站時間約每 1 分鐘更新 · 車程為歷史平均估算</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
