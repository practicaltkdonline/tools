<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>音波播放器</title>
  <style>
    :root {
      --bg: #0b0d12;
      --line: #2a3140;
      --text: #eef2f8;
      --muted: #8b95a8;
      --accent: #5eead4;
      --accent-2: #818cf8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1a2340 0%, transparent 50%),
        radial-gradient(900px 500px at 100% 0%, #13241f 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: "SF Pro Display", "PingFang HK", "Noto Sans TC", system-ui, sans-serif;
    }
    body { display: flex; justify-content: center; padding: 24px 16px 40px; }
    .app { width: min(920px, 100%); }
    header {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 1.35rem; letter-spacing: 0.04em; font-weight: 650; }
    .sub { color: var(--muted); font-size: 0.85rem; }
    .stage {
      background: linear-gradient(180deg, #1a2030 0%, #12161f 100%);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px 18px 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    canvas#viz {
      width: 100%; height: 180px; display: block;
      border-radius: 14px; background: #0a0d14;
    }
    .meta { display: flex; align-items: center; gap: 14px; margin: 16px 0 12px; }
    .art {
      width: 64px; height: 64px; border-radius: 14px;
      background: conic-gradient(from 200deg, #5eead4, #818cf8, #fb7185, #5eead4);
      display: grid; place-items: center; font-size: 1.6rem; flex-shrink: 0;
    }
    .title { font-size: 1.1rem; font-weight: 650; }
    .artist { color: var(--muted); font-size: 0.88rem; margin-top: 3px; }
    .times {
      display: flex; justify-content: space-between;
      font-variant-numeric: tabular-nums; color: var(--muted);
      font-size: 0.8rem; margin: 6px 2px 0;
    }
    .wave-seek {
      position: relative;
      height: 92px;
      border-radius: 12px;
      overflow: hidden;
      background: #0a0d14;
      border: 1px solid #243044;
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }
    canvas#wave {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .playhead {
      position: absolute; top: 0; bottom: 0; width: 2px;
      background: #fff;
      box-shadow: 0 0 8px rgba(255,255,255,.7);
      left: 0%;
      pointer-events: none;
      z-index: 2;
    }
    .hover-line {
      position: absolute; top: 0; bottom: 0; width: 1px;
      background: rgba(255,255,255,.35);
      left: -10px;
      pointer-events: none;
      z-index: 2;
    }
    .hover-tip {
      position: absolute; top: 6px;
      transform: translateX(-50%);
      background: #0f172a; border: 1px solid #334155;
      color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 6px;
      pointer-events: none; opacity: 0; z-index: 3;
      font-variant-numeric: tabular-nums;
    }
    .controls {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-top: 16px; flex-wrap: wrap;
    }
    .transport { display: flex; align-items: center; gap: 10px; }
    button {
      border: 0; background: #22293a; color: var(--text);
      width: 46px; height: 46px; border-radius: 50%;
      cursor: pointer; font-size: 1.05rem;
    }
    .transport button {
      width: 48px; height: 48px;
      border: 2px solid #e8eef6;
      background: transparent;
      color: #e8eef6;
      display: grid; place-items: center; padding: 0;
    }
    .transport button svg { width: 22px; height: 22px; display: block; }
    .transport button.cue-nav {
      border-color: #fbbf24;
      color: #fbbf24;
    }
    button#play {
      width: 62px; height: 62px;
      border: 0;
      background: linear-gradient(180deg, #5eead4, #2dd4bf);
      color: #06201b; font-size: 1.35rem; font-weight: 700;
    }
    .cue-menu {
      position: absolute; z-index: 8;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 6px;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .cue-menu button {
      width: auto; height: auto; border-radius: 8px;
      padding: 8px 12px; font-size: 0.85rem;
      background: #1e293b;
    }
    .cue-list {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 10px;
    }
    .cue-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: #1b2436; border: 1px solid #f59e0b55;
      color: #fbbf24; border-radius: 999px;
      padding: 4px 8px 4px 10px; font-size: 0.78rem;
      font-variant-numeric: tabular-nums; cursor: pointer;
    }
    .cue-chip button {
      width: 22px; height: 22px; border-radius: 50%;
      background: #3f1d1d; color: #fb7185; font-size: 0.7rem;
    }
    button:hover { filter: brightness(1.08); }
    .vol-box {
      display: flex; align-items: center; gap: 8px;
      color: var(--muted); min-width: 220px;
    }
    input[type="range"]#vol {
      -webkit-appearance: none; appearance: none;
      width: 160px; height: 22px; background: transparent; cursor: pointer;
    }
    input[type="range"]#vol::-webkit-slider-runnable-track {
      height: 8px; border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-2) var(--p, 70%), #2a3140 var(--p, 70%));
    }
    input[type="range"]#vol::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      margin-top: -4px; border-radius: 50%; background: #fff;
    }
    .vol-pct { width: 40px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
    .playlist { margin-top: 16px; display: grid; gap: 6px; }
    .track {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 12px;
      background: #10151e; border: 1px solid transparent; cursor: pointer;
    }
    .track.active { border-color: #2dd4bf55; background: #12201c; }
    .track small { color: var(--muted); margin-left: auto; }
    .track .del {
      width: 32px; height: 32px; border-radius: 8px;
      background: #2a1620; color: #fb7185; font-size: 0.85rem;
      flex-shrink: 0;
    }
    .hint { margin-top: 12px; color: var(--muted); font-size: 0.8rem; line-height: 1.5; }
    .file-row { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    label.file {
      background: #22293a; padding: 8px 12px; border-radius: 10px;
      cursor: pointer; font-size: 0.85rem;
    }
    input[type="file"] { display: none; }
    .wave-status { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>音波播放器</h1>
      <div class="sub">進度條顯示每段有沒有聲音 · 可拖去任意位置</div>
    </header>
    <div class="stage">
      <canvas id="viz" width="900" height="180"></canvas>
      <div class="meta">
        <div class="art">♪</div>
        <div>
          <div class="title" id="title">尚未載入</div>
          <div class="artist" id="artist">示範曲目或本機檔案</div>
        </div>
      </div>
      <div class="wave-seek" id="seekBox">
        <canvas id="wave" width="900" height="144"></canvas>
        <div class="playhead" id="playhead"></div>
        <div class="hover-line" id="hoverLine"></div>
        <div class="hover-tip" id="hoverTip">0:00</div>
        <div class="cue-menu" id="cueMenu">
          <button type="button" id="cueAddBtn">加入錨點</button>
          <button type="button" id="cueDelBtn" style="display:none;background:#3f1d1d;color:#fda4af">刪除此錨點</button>
        </div>
      </div>
      <div class="times">
        <span id="cur">0:00</span>
        <span class="wave-status" id="waveStatus">正在分析波形…</span>
        <span id="dur">0:00</span>
      </div>
      <div class="controls">
        <div class="transport">
          <button class="cue-nav" id="prevCue" title="上一個錨點（Shift+&lt;）" aria-label="上一個錨點">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="2.4" height="14" rx="0.6"/><path d="M20 5v14L8.2 12z"/></svg>
          </button>
          <button id="prev" title="上一首" aria-label="上一首">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.8 5v14L2.2 12z"/><path d="M21.8 5v14L12.2 12z"/></svg>
          </button>
          <button id="play" title="播放／暫停" aria-label="播放或暫停">▶</button>
          <button id="next" title="下一首" aria-label="下一首">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.2 5v14L11.8 12z"/><path d="M12.2 5v14L21.8 12z"/></svg>
          </button>
          <button class="cue-nav" id="nextCue" title="下一個錨點（Shift+&gt;）" aria-label="下一個錨點">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5v14L15.8 12z"/><rect x="18.6" y="5" width="2.4" height="14" rx="0.6"/></svg>
          </button>
        </div>
        <div class="vol-box">
          <span>音量</span>
          <input id="vol" type="range" min="0" max="100" value="80" />
          <span class="vol-pct" id="volPct">80%</span>
        </div>
      </div>
      <div class="cue-list" id="cueList"></div>
      <div class="file-row">
        <label class="file">加入音樂（建議）
          <input id="files" type="file" accept=".mp3,.m4a,.aac,.wav,.ogg,.flac,.mp4,audio/mpeg,audio/mp4,audio/aac,audio/wav,audio/*" multiple />
        </label>
        <label class="file">從檔案選任何檔
          <input id="filesAny" type="file" accept="*/*" multiple />
        </label>
      </div>
      <div class="playlist" id="list"></div>
      <p class="hint">進度條像 YouTube／SoundCloud：柱子高＝大聲，平＝靜音。中間有時間刻度，可拖動跳播。<br>
      iPhone：若只見到 MP4、見不到 MP3，請按「從檔案選任何檔」→ 瀏覽 →「檔案」App，不要用相片／影片分頁。Safari 的 audio 過濾器常把選擇器開成影片庫。<br>
      支援 MP3／M4A／AAC／WAV／MP4（只播聲音）。不能讀「音樂」App／Apple Music 曲庫。</p>
    </div>
  </div>
  <script>
    const tracks = [];

    const audio = new Audio();
    audio.preload = "metadata";
    audio.playsInline = true;
    audio.setAttribute("playsinline", "");

    let actx, analyser, srcNode, freq, started = false;
    let index = 0;
    let peaks = [];
    let peakDuration = 0;
    let analyzing = false;
    let analyzeToken = 0;

    const $ = (id) => document.getElementById(id);
    const viz = $("viz");
    const vc = viz.getContext("2d");
    const wave = $("wave");
    const wc = wave.getContext("2d");
    const seekBox = $("seekBox");
    const playhead = $("playhead");
    const hoverLine = $("hoverLine");
    const hoverTip = $("hoverTip");

    function fmt(t) {
      if (!isFinite(t) || t < 0) return "0:00";
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60).toString().padStart(2, "0");
      return m + ":" + s;
    }

    function ensureGraph() {
      if (started) return;
      actx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = actx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.78;
      srcNode = actx.createMediaElementSource(audio);
      srcNode.connect(analyser);
      analyser.connect(actx.destination);
      freq = new Uint8Array(analyser.frequencyBinCount);
      started = true;
    }

    async function offlineCtx() {
      if (actx) return actx;
      return new (window.AudioContext || window.webkitAudioContext)();
    }

    function computePeaks(buffer, bars = 360) {
      const raw = buffer.getChannelData(0);
      const ch2 = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : null;
      const block = Math.max(1, Math.floor(raw.length / bars));
      const out = new Array(bars);
      for (let i = 0; i < bars; i++) {
        const start = i * block;
        const end = Math.min(raw.length, start + block);
        let peak = 0, sum = 0, n = 0;
        for (let j = start; j < end; j += 8) {
          let s = Math.abs(raw[j]);
          if (ch2) s = (s + Math.abs(ch2[j])) * 0.5;
          if (s > peak) peak = s;
          sum += s; n++;
        }
        const rms = n ? sum / n : 0;
        out[i] = Math.min(1, peak * 0.65 + rms * 1.6);
      }
      return out;
    }

    function niceStep(dur) {
      if (dur <= 30) return 5;
      if (dur <= 90) return 10;
      if (dur <= 180) return 15;
      if (dur <= 360) return 30;
      if (dur <= 720) return 60;
      if (dur <= 1800) return 120;
      return 300;
    }

    function drawWaveform() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const rect = seekBox.getBoundingClientRect();
      const w = Math.max(300, Math.floor(rect.width * dpr));
      const h = Math.max(80, Math.floor(rect.height * dpr));
      if (wave.width !== w || wave.height !== h) {
        wave.width = w; wave.height = h;
      }
      wc.clearRect(0, 0, w, h);
      wc.fillStyle = "#0a0d14";
      wc.fillRect(0, 0, w, h);

      const labelH = 18 * dpr;
      const mid = (h - labelH) / 2;
      const played = audio.duration ? audio.currentTime / audio.duration : 0;
      const dur = audio.duration || peakDuration || 0;

      if (peaks.length) {
        const n = peaks.length;
        const gap = Math.max(1, Math.floor(w / n * 0.22));
        const bw = Math.max(1, w / n - gap);
        for (let i = 0; i < n; i++) {
          const amp = Math.max(0.04, peaks[i]);
          const hh = amp * ((h - labelH) * 0.42);
          const x = (i / n) * w;
          const playedBar = i / n <= played;
          wc.fillStyle = playedBar ? "#5eead4" : "#334155";
          wc.fillRect(x, mid - hh, bw, hh * 2);
        }
      } else {
        wc.fillStyle = "#1e293b";
        wc.fillRect(0, mid - 2 * dpr, w, 4 * dpr);
      }

      if (dur > 0) {
        const step = niceStep(dur);
        wc.font = `${11 * dpr}px "SF Pro Text", "PingFang HK", sans-serif`;
        wc.textBaseline = "top";
        for (let t = 0; t <= dur + 0.01; t += step) {
          const x = (t / dur) * w;
          wc.strokeStyle = "rgba(148,163,184,0.28)";
          wc.lineWidth = Math.max(1, dpr * 0.6);
          wc.beginPath();
          wc.moveTo(x, 4 * dpr);
          wc.lineTo(x, h - labelH - 2 * dpr);
          wc.stroke();
          wc.fillStyle = "#94a3b8";
          const label = fmt(t);
          if (t === 0) {
            wc.textAlign = "left";
            wc.fillText(label, x + 3 * dpr, h - labelH + 2 * dpr);
          } else if (t >= dur - step * 0.25) {
            wc.textAlign = "right";
            wc.fillText(fmt(dur), w - 3 * dpr, h - labelH + 2 * dpr);
          } else {
            wc.textAlign = "center";
            wc.fillText(label, x, h - labelH + 2 * dpr);
          }
        }
      }

      const cues = (tracks[index] && tracks[index].cues) || [];
      const dur2 = audio.duration || peakDuration || 0;
      cues.forEach((sec) => {
        if (!dur2) return;
        const x = (sec / dur2) * w;
        wc.fillStyle = "#fbbf24";
        wc.beginPath();
        wc.moveTo(x, 2 * dpr);
        wc.lineTo(x - 5 * dpr, 12 * dpr);
        wc.lineTo(x + 5 * dpr, 12 * dpr);
        wc.closePath();
        wc.fill();
        wc.fillRect(x - dpr, 12 * dpr, 2 * dpr, h - labelH - 14 * dpr);
      });
    }

    async function analyzeCurrent() {
      if (!tracks[index]) return;
      const token = ++analyzeToken;
      peaks = [];
      peakDuration = 0;
      $("waveStatus").textContent = "正在分析哪一段有聲音…";
      drawWaveform();
      const src = tracks[index].src;
      try {
        analyzing = true;
        const res = await fetch(src);
        if (!res.ok) throw new Error("fetch " + res.status);
        const buf = await res.arrayBuffer();
        if (token !== analyzeToken) return;
        const decCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 44100, 44100);
        // decode with a real AudioContext
        const decoder = actx || new (window.AudioContext || window.webkitAudioContext)();
        const decoded = await decoder.decodeAudioData(buf.slice(0));
        if (token !== analyzeToken) return;
        peaks = computePeaks(decoded, Math.min(480, Math.max(220, Math.floor(decoded.duration * 8))));
        peakDuration = decoded.duration;
        $("waveStatus").textContent = "高柱＝有聲／大聲　平線＝靜音";
        drawWaveform();
      } catch (err) {
        console.warn(err);
        $("waveStatus").textContent = "示範曲若無法分析，請加入本機音樂（波形更準）";
        drawWaveform();
      } finally {
        analyzing = false;
      }
    }

    function removeTrack(i) {
      if (i < 0 || i >= tracks.length) return;
      const src = tracks[i].src;
      const removingCurrent = i === index;
      const wasPlaying = !audio.paused;
      tracks.splice(i, 1);
      if (src.startsWith("blob:")) try { URL.revokeObjectURL(src); } catch (_) {}
      if (!tracks.length) {
        pause();
        audio.removeAttribute("src");
        load(0);
        return;
      }
      if (removingCurrent) {
        const next = Math.min(i, tracks.length - 1);
        load(next);
        if (wasPlaying) play();
      } else {
        if (i < index) index -= 1;
        renderList();
      }
    }

    function applySrc(src) {
      if (/^https?:/i.test(src)) audio.crossOrigin = "anonymous";
      else audio.removeAttribute("crossorigin");
      audio.src = src;
    }

    function load(i) {
      if (!tracks.length) {
        index = 0;
        $("title").textContent = "尚未載入";
        $("artist").textContent = "請加入本機音樂";
        peaks = [];
        playhead.style.left = "0%";
        $("cur").textContent = "0:00";
        $("dur").textContent = "0:00";
        $("waveStatus").textContent = "未有曲目";
        renderList();
        drawWaveform();
        return;
      }
      index = ((i % tracks.length) + tracks.length) % tracks.length;
      const t = tracks[index];
      applySrc(t.src);
      $("title").textContent = t.title;
      $("artist").textContent = t.artist;
      playhead.style.left = "0%";
      renderList();
      renderCues();
      audio.load();
      analyzeCurrent();
    }

    function currentCues() {
      if (!tracks[index]) return [];
      if (!tracks[index].cues) tracks[index].cues = [];
      return tracks[index].cues;
    }
    function renderCues() {
      const list = $("cueList");
      const cues = currentCues().slice().sort((a,b) => a-b);
      if (!cues.length) {
        list.innerHTML = "";
        return;
      }
      list.innerHTML = cues.map((sec, i) =>
        `<span class="cue-chip" data-sec="${sec}">
          錨點 ${i+1} ${fmt(sec)}
          <button type="button" data-delcue="${sec}">✕</button>
        </span>`
      ).join("");
      list.querySelectorAll(".cue-chip").forEach(el => {
        el.onclick = (e) => {
          if (e.target.closest("[data-delcue]")) return;
          seekToTime(+el.dataset.sec);
        };
      });
      list.querySelectorAll("[data-delcue]").forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          removeCue(+btn.dataset.delcue);
        };
      });
    }
    function addCue(sec) {
      if (!tracks[index] || !isFinite(sec)) return;
      const cues = currentCues();
      if (cues.some(c => Math.abs(c - sec) < 0.35)) return;
      cues.push(Math.max(0, sec));
      cues.sort((a,b) => a-b);
      renderCues();
      drawWaveform();
    }
    function removeCue(sec) {
      if (!tracks[index]) return;
      tracks[index].cues = currentCues().filter(c => Math.abs(c - sec) > 0.2);
      renderCues();
      drawWaveform();
    }
    function cueNear(sec, pxTol = 10) {
      const dur = audio.duration || peakDuration || 0;
      if (!dur) return null;
      const w = seekBox.getBoundingClientRect().width;
      let best = null, bestD = Infinity;
      currentCues().forEach(c => {
        const d = Math.abs((c / dur) * w - (sec / dur) * w);
        if (d < bestD) { bestD = d; best = c; }
      });
      return bestD <= pxTol ? best : null;
    }
    function seekToTime(sec) {
      if (!audio.duration) return;
      audio.currentTime = Math.min(audio.duration, Math.max(0, sec));
      const p = audio.currentTime / audio.duration;
      playhead.style.left = (p * 100) + "%";
      $("cur").textContent = fmt(audio.currentTime);
      drawWaveform();
    }
    function jumpPrevCue() {
      if (!tracks.length) return;
      const t = audio.currentTime || 0;
      const prevs = currentCues().filter(c => c < t - 0.35);
      if (prevs.length) {
        seekToTime(prevs[prevs.length - 1]);
        return;
      }
      if (t > 0.4) { restartCurrent(); return; }
      const wasPlaying = !audio.paused;
      load(index - 1);
      if (wasPlaying) play();
    }
    function jumpNextCue() {
      if (!tracks.length) return;
      const t = audio.currentTime || 0;
      const nexts = currentCues().filter(c => c > t + 0.35);
      if (nexts.length) {
        seekToTime(nexts[0]);
        return;
      }
      load(index + 1);
      play();
    }

    function renderList() {
      if (!tracks.length) {
        $("list").innerHTML = `<div class="track" style="cursor:default;opacity:.7">播放列表是空的，請加入音樂</div>`;
        return;
      }
      $("list").innerHTML = tracks.map((t, i) =>
        `<div class="track ${i===index?'active':''}" data-i="${i}">
          <span>${i===index?'▶':'○'}</span>
          <span>${t.title}</span>
          <small>${t.artist}</small>
          <button class="del" data-del="${i}" title="刪除">✕</button>
        </div>`
      ).join("");
      $("list").querySelectorAll(".track").forEach(el => {
        el.onclick = (e) => {
          if (e.target.closest("[data-del]")) return;
          load(+el.dataset.i); play();
        };
      });
      $("list").querySelectorAll("[data-del]").forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          removeTrack(+btn.dataset.del);
        };
      });
    }

    async function play() {
      ensureGraph();
      if (actx.state === "suspended") await actx.resume();
      try { await audio.play(); $("play").textContent = "❚❚"; }
      catch (e) {
        console.warn(e);
        $("waveStatus").textContent = "播放失敗：" + (e.message || "請改用「從檔案選任何檔」選 MP3");
      }
    }
    function pause() {
      audio.pause();
      $("play").textContent = "▶";
    }

    $("play").onclick = () => {
      if (!tracks.length) return;
      audio.paused ? play() : pause();
    };
    function restartCurrent() {
      audio.currentTime = 0;
      playhead.style.left = "0%";
      $("cur").textContent = "0:00";
      drawWaveform();
    }
    $("prev").onclick = () => {
      if (!tracks.length) return;
      if ((audio.currentTime || 0) > 0.4) {
        restartCurrent();
        return;
      }
      const wasPlaying = !audio.paused;
      load(index - 1);
      if (wasPlaying) play();
    };
    $("next").onclick = () => {
      if (!tracks.length) return;
      load(index + 1);
      play();
    };
    $("prevCue").onclick = jumpPrevCue;
    $("nextCue").onclick = jumpNextCue;

    audio.addEventListener("ended", () => {
      if (!tracks.length) return;
      if (index < tracks.length - 1) { load(index + 1); play(); }
      else pause();
    });
    audio.addEventListener("loadedmetadata", () => {
      $("dur").textContent = fmt(audio.duration);
    });
    audio.addEventListener("timeupdate", () => {
      if (!audio.duration) return;
      const p = audio.currentTime / audio.duration;
      playhead.style.left = (p * 100) + "%";
      $("cur").textContent = fmt(audio.currentTime);
      drawWaveform();
    });

    function posFromEvent(e) {
      const r = seekBox.getBoundingClientRect();
      const x = (e.clientX ?? (e.touches && e.touches[0].clientX) ?? 0) - r.left;
      return Math.min(1, Math.max(0, x / r.width));
    }
    function seekTo(p) {
      if (!audio.duration) return;
      audio.currentTime = p * audio.duration;
      playhead.style.left = (p * 100) + "%";
      $("cur").textContent = fmt(audio.currentTime);
      drawWaveform();
    }

    let dragging = false;
    let holdTimer = null;
    let holdPos = 0;
    let menuOpen = false;
    let startX = 0;
    const cueMenu = $("cueMenu");

    function hideCueMenu() {
      menuOpen = false;
      cueMenu.style.display = "none";
    }
    function showCueMenu(p, clientX, box) {
      menuOpen = true;
      dragging = false;
      const dur = audio.duration || peakDuration || 0;
      const sec = p * dur;
      const near = cueNear(sec);
      holdPos = near != null ? near : sec;
      $("cueAddBtn").style.display = near == null ? "inline-block" : "none";
      $("cueDelBtn").style.display = near != null ? "inline-block" : "none";
      cueMenu.style.display = "block";
      const left = Math.min(box.width - 130, Math.max(8, p * box.width - 40));
      cueMenu.style.left = left + "px";
      cueMenu.style.top = "8px";
    }
    $("cueAddBtn").onclick = (e) => {
      e.stopPropagation();
      addCue(holdPos);
      hideCueMenu();
    };
    $("cueDelBtn").onclick = (e) => {
      e.stopPropagation();
      removeCue(holdPos);
      hideCueMenu();
    };

    seekBox.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".cue-menu")) return;
      hideCueMenu();
      dragging = false;
      startX = e.clientX;
      const p = posFromEvent(e);
      holdPos = p * (audio.duration || peakDuration || 0);
      seekBox.setPointerCapture(e.pointerId);
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        showCueMenu(p, e.clientX, seekBox.getBoundingClientRect());
      }, 520);
    });
    seekBox.addEventListener("pointermove", (e) => {
      const p = posFromEvent(e);
      hoverLine.style.left = (p * 100) + "%";
      hoverTip.style.left = (p * 100) + "%";
      hoverTip.style.opacity = "1";
      const dur = audio.duration || peakDuration || 0;
      hoverTip.textContent = fmt(p * dur);
      const pressed = (e.buttons & 1) === 1;
      if (!pressed) {
        dragging = false;
        return;
      }
      if (Math.abs(e.clientX - startX) > 8 && !menuOpen) {
        clearTimeout(holdTimer);
        dragging = true;
      }
      if (dragging) seekTo(p);
    });
    seekBox.addEventListener("pointerup", (e) => {
      clearTimeout(holdTimer);
      if (!menuOpen && !dragging) seekTo(posFromEvent(e));
      dragging = false;
      try { seekBox.releasePointerCapture(e.pointerId); } catch (_) {}
    });
    seekBox.addEventListener("pointercancel", (e) => {
      clearTimeout(holdTimer);
      dragging = false;
      try { seekBox.releasePointerCapture(e.pointerId); } catch (_) {}
    });
    seekBox.addEventListener("pointerleave", () => {
      hoverLine.style.left = "-10px";
      hoverTip.style.opacity = "0";
    });

    function setVol(v) {
      audio.volume = v / 100;
      $("vol").value = v;
      $("vol").style.setProperty("--p", v + "%");
      $("volPct").textContent = v + "%";
    }
    $("vol").addEventListener("input", () => setVol(+$("vol").value));
    setVol(80);

    const OK_EXT = /\.(mp3|m4a|aac|wav|ogg|flac|mp4|mpeg|m4b)$/i;
    function addLocalFiles(fileList) {
      const added = [];
      [...fileList].forEach(f => {
        const type = (f.type || "").toLowerCase();
        const ok = type.startsWith("audio/") || type === "video/mp4" || type === "video/quicktime" || OK_EXT.test(f.name);
        if (!ok) {
          alert("不支援：" + f.name + "（請選 mp3 / m4a / aac / wav / mp4）");
          return;
        }
        tracks.push({
          title: f.name.replace(/\.[^.]+$/, ""),
          artist: "本機檔案 · " + (f.name.split(".").pop() || "").toUpperCase(),
          src: URL.createObjectURL(f),
          cues: []
        });
        added.push(tracks.length - 1);
      });
      renderList();
      if (added.length) { load(added[0]); play(); }
    }
    $("files").addEventListener("change", (e) => addLocalFiles(e.target.files));
    $("filesAny").addEventListener("change", (e) => addLocalFiles(e.target.files));

    function drawViz() {
      requestAnimationFrame(drawViz);
      const w = viz.width, h = viz.height;
      vc.fillStyle = "#0a0d14";
      vc.fillRect(0, 0, w, h);
      vc.strokeStyle = "#1c2433";
      vc.beginPath();
      vc.moveTo(0, h * 0.82);
      vc.lineTo(w, h * 0.82);
      vc.stroke();

      if (!analyser) {
        const t = Date.now() / 600;
        for (let i = 0; i < 48; i++) {
          const x = 20 + i * ((w - 40) / 48);
          const hh = 8 + Math.abs(Math.sin(t + i * 0.2)) * 18;
          vc.fillStyle = "rgba(94,234,212,0.25)";
          vc.fillRect(x, h * 0.82 - hh, 8, hh);
        }
        return;
      }
      analyser.getByteFrequencyData(freq);
      const n = 56;
      const step = Math.floor(freq.length / n);
      const gap = 4;
      const bw = (w - 40) / n - gap;
      for (let i = 0; i < n; i++) {
        let v = 0;
        for (let k = 0; k < step; k++) v += freq[i * step + k];
        v /= step;
        const hh = Math.max(4, (v / 255) * (h * 0.72));
        const x = 20 + i * (bw + gap);
        const y = h * 0.82 - hh;
        const g = vc.createLinearGradient(0, y, 0, y + hh);
        g.addColorStop(0, "#5eead4");
        g.addColorStop(0.55, "#818cf8");
        g.addColorStop(1, "#334155");
        vc.fillStyle = g;
        vc.fillRect(x, y, bw, hh);
      }
    }

    window.addEventListener("resize", drawWaveform);
    window.addEventListener("keydown", (e) => {
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      if (e.code === "Space") {
        e.preventDefault();
        if (!tracks.length) return;
        audio.paused ? play() : pause();
        return;
      }
      if (e.shiftKey && (e.key === "<" || e.key === "," || e.code === "Comma")) {
        e.preventDefault();
        jumpPrevCue();
        return;
      }
      if (e.shiftKey && (e.key === ">" || e.key === "." || e.code === "Period")) {
        e.preventDefault();
        jumpNextCue();
      }
    });
    load(0);
    drawViz();
  </script>
</body>
</html>
